<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>octoview splat</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0d1117;
        overflow: hidden;
      }
      canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <!-- Extension page: the manifest CSP allows workers + WASM, unlike github's
         content-script context, so Spark runs here. Any failure (a CSP refusal of
         the module/worker/WASM, a load error, or a Spark exception) is reported to
         the content script, which logs it and falls back to the main-thread
         renderer. splat-viewer.js is an external module (script-src 'self'), so an
         inline-module CSP quirk is not a variable. -->
    <script>
      const post = (m) => parent.postMessage(m, '*');
      addEventListener('securitypolicyviolation', (e) =>
        post({
          type: 'ov-splat-error',
          error: 'CSP blocked ' + e.violatedDirective + ' ' + (e.blockedURI || ''),
        })
      );
      addEventListener(
        'error',
        (e) =>
          post({
            type: 'ov-splat-error',
            error: 'error: ' + (e.message || (e.error && e.error.message) || e.filename || ''),
          }),
        true
      );
      addEventListener('unhandledrejection', (e) =>
        post({ type: 'ov-splat-error', error: 'reject: ' + ((e.reason && e.reason.message) || e.reason || '') })
      );
    </script>
    <script type="module" src="splat-viewer.js"></script>
  </body>
</html>
