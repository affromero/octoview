<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #fff;
      }
      #ovd {
        padding: 22px;
        font: 13px/1.5 -apple-system, BlinkMacSystemFont, sans-serif;
        color: #57606a;
      }
    </style>
  </head>
  <body>
    <!-- Manifest-declared sandbox page. Its CSP allows a report's own inline
         scripts. The static text below tells us how far it got if something
         fails: a blank box means the page did not load; "waiting" means the
         script ran but no HTML arrived. document.write replaces all of this on
         success. -->
    <div id="ovd">Loading report&hellip;</div>
    <script>
      var d = document.getElementById('ovd');
      if (d) d.textContent = 'Sandbox ready, waiting for the report HTML…';
      window.addEventListener('message', function (e) {
        var html = e.data && e.data.octoviewHtml;
        if (typeof html !== 'string') return;
        document.open();
        document.write(html);
        document.close();
      });
      // Echo the nonce the viewer put in our hash so it can match us.
      if (window.parent) window.parent.postMessage({ octoviewReady: location.hash.slice(1) || true }, '*');
    </script>
  </body>
</html>
