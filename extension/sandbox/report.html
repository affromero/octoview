<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #fff;
      }
    </style>
  </head>
  <body>
    <!-- This is a manifest-declared sandbox page: its CSP allows 'unsafe-inline',
         so a report's own inline scripts run here. It has no extension-API access.
         The viewer posts the report HTML in; we write it into this document. -->
    <script>
      window.addEventListener('message', function (e) {
        var html = e.data && e.data.octoviewHtml;
        if (typeof html !== 'string') return;
        document.open();
        document.write(html);
        document.close();
      });
      // Tell the viewer (our parent) we're ready to receive the report HTML.
      if (window.parent) window.parent.postMessage({ octoviewReady: true }, '*');
    </script>
  </body>
</html>
