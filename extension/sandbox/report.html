<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #fff;
      }
    </style>
  </head>
  <body>
    <!-- Manifest-declared sandbox page: its CSP allows a report's own inline
         scripts to run. It has no extension-API access. The viewer posts the
         report HTML in; we write it here, where its scripts run. -->
    <script>
      window.addEventListener('message', function (e) {
        var html = e.data && e.data.octoviewHtml;
        if (typeof html !== 'string') return;
        document.open();
        document.write(html);
        document.close();
      });
      // Echo the nonce the viewer put in our hash so it can match us.
      if (window.parent)
        window.parent.postMessage({ octoviewReady: location.hash.slice(1) || true }, '*');
    </script>
  </body>
</html>
