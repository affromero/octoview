<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>octoview</title>
    <style>
      html, body { margin: 0; height: 100%; }
      body { font: 14px/1.5 -apple-system, BlinkMacSystemFont, sans-serif; color: #1f2328; }
      #status { padding: 12px 16px; color: #59636e; border-bottom: 1px solid #d1d9e0; }
      #mount { height: calc(100% - 45px); }
      @media (prefers-color-scheme: dark) {
        body { background: #0d1117; color: #e6edf3; }
        #status { color: #9198a1; border-color: #3d444d; }
      }
    </style>
  </head>
  <body>
    <div id="status">Loading…</div>
    <div id="mount"></div>
    <script src="viewer.js"></script>
  </body>
</html>
