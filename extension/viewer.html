<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>octoview</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0d1117;
        color: #e6edf3;
        font:
          14px/1.55 -apple-system,
          BlinkMacSystemFont,
          sans-serif;
      }
      #mount {
        width: 100%;
        height: 100%;
        overflow: auto;
      }
      .ov-full {
        width: 100%;
        height: 100%;
        border: 0;
        background: #fff;
      }
      .ov-msg {
        padding: 24px;
      }
      .ov-nb {
        max-width: 980px;
        margin: 0 auto;
        padding: 24px 20px;
      }
      .ov-md :is(h1, h2, h3) {
        border-bottom: 1px solid #21262d;
        padding-bottom: 0.3em;
      }
      .ov-md a {
        color: #4493f8;
      }
      .ov-code {
        background: #161b22;
        border: 1px solid #21262d;
        border-radius: 6px;
        padding: 12px 14px;
        overflow-x: auto;
        font:
          12.5px/1.5 ui-monospace,
          monospace;
        color: #e6edf3;
        margin: 0 0 4px;
      }
      .ov-nb-text {
        padding: 4px 14px;
        margin: 0 0 10px;
        overflow-x: auto;
        font:
          12.5px/1.5 ui-monospace,
          monospace;
        white-space: pre-wrap;
        color: #adbac7;
      }
      .ov-nb-err {
        color: #ff7b72;
      }
      .ov-nb-out {
        width: 100%;
        height: 520px;
        border: 1px solid #21262d;
        border-radius: 6px;
        background: #fff;
        margin: 0 0 12px;
      }
      .ov-nb-img {
        max-width: 100%;
        background: #fff;
        border-radius: 6px;
        margin: 0 0 12px;
      }
    </style>
  </head>
  <body>
    <div id="mount"><p class="ov-msg">Loading…</p></div>
    <script src="core.js"></script>
    <script src="vendor/marked.min.js"></script>
    <script src="viewer.js"></script>
  </body>
</html>
