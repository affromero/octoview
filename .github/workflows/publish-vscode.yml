name: Publish VS Code extension

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Full commit SHA to publish from main
        required: true
        type: string

concurrency:
  group: vscode-marketplace
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Verify requested commit
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          if [ "$GITHUB_SHA" != "$EXPECTED_SHA" ]; then
            echo "::error::main does not match the requested commit $EXPECTED_SHA"
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ci
      - run: npm run audit
      - run: npm run build:vscode
      - name: Publish to Visual Studio Marketplace
        run: npx --no-install vsce publish --packagePath build/octoview-vscode.vsix --oidc
