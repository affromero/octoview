<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>octoview sample · HTML report</title>
    <style>
      body {
        margin: 0;
        font:
          15px/1.5 -apple-system,
          BlinkMacSystemFont,
          sans-serif;
        color: #1f2328;
        padding: 32px;
        max-width: 760px;
      }
      h1 {
        margin: 0 0 4px;
      }
      table {
        border-collapse: collapse;
        margin-top: 12px;
        font-variant-numeric: tabular-nums;
      }
      th {
        border-bottom: 2px solid #d1d9e0;
        padding: 4px 24px 4px 0;
        text-align: left;
      }
      td {
        padding: 4px 24px 4px 0;
      }
      .num {
        text-align: right;
      }
      figure {
        margin: 20px 0 0;
      }
      figcaption {
        color: #59636e;
        font-size: 13px;
        margin-top: 6px;
      }
    </style>
  </head>
  <body>
    <h1>Training report</h1>
    <p>
      GitHub shows this file's raw source. octoview renders it in place, so self-contained HTML
      content (headings, tables, and inline SVG charts) shows exactly as authored.
    </p>

    <table>
      <thead>
        <tr>
          <th>metric</th>
          <th class="num">value</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>accuracy</td>
          <td class="num" style="color: #1a7f37">0.947</td>
        </tr>
        <tr>
          <td>loss</td>
          <td class="num" style="color: #0969da">0.081</td>
        </tr>
        <tr>
          <td>epochs</td>
          <td class="num">12</td>
        </tr>
      </tbody>
    </table>

    <figure>
      <svg width="480" height="180" viewBox="0 0 480 180" role="img" aria-label="loss curve">
        <rect x="0" y="0" width="480" height="180" fill="#f6f8fa" rx="8" />
        <line x1="40" y1="150" x2="460" y2="150" stroke="#d1d9e0" />
        <line x1="40" y1="20" x2="40" y2="150" stroke="#d1d9e0" />
        <polyline
          fill="none"
          stroke="#2ea043"
          stroke-width="2.5"
          points="40,40 75,70 110,92 145,105 180,118 215,126 250,132 285,137 320,140 355,143 390,145 425,146"
        />
        <text x="46" y="34" font-size="12" fill="#59636e">loss</text>
      </svg>
      <figcaption>Validation loss over 12 epochs (static inline SVG).</figcaption>
    </figure>
  </body>
</html>
