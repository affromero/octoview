---
# Setup: pre-commit install --install-hooks
# Vendored libs and generated dirs are excluded so they aren't reformatted/flagged.
default_install_hook_types: [pre-commit]
exclude: '^(extension/vendor/|samples/|Safari/|package-lock\.json)'
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix, lf]
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=2000]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: detect-private-key

  - repo: local
    hooks:
      - id: lint-staged
        name: lint-staged (eslint + prettier)
        entry: npx lint-staged --allow-empty
        language: system
        pass_filenames: false
      - id: vitest
        name: vitest
        entry: npx vitest run
        language: system
        always_run: true
        pass_filenames: false
